{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helix.serviceAccountName" . }}
  labels:
    {{- include "helix.labels" . | nindent 4 }}
  annotations:
    # This one annotation is the entire trust relationship: it tells the AKS
    # Workload Identity webhook which Azure AD application this ServiceAccount
    # is allowed to become. There is no client secret here or anywhere else
    # in this chart — the federation trust (this SA's namespace + name +
    # the cluster's OIDC issuer) is established once, out-of-band, on the
    # Azure identity's FederatedIdentityCredential (see infra/identity.tf).
    #
    # Left blank in the chart's own default values.yaml on purpose (so
    # `helm lint`/`helm template` succeed with zero overrides); every real
    # environment values file (values-dev.yaml, values-prod.yaml) sets it.
    # A pod deployed with this blank has no Key Vault access at all — the
    # honest failure mode for "forgot to set it" is the CSI volume mount
    # failing at pod start, not a silent fallback to some other credential
    # source.
    {{- if .Values.serviceAccount.workloadIdentityClientId }}
    azure.workload.identity/client-id: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
