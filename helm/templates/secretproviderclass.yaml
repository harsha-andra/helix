{{- if .Values.secretProviderClass.enabled -}}
# Secrets Store CSI Driver, Azure Key Vault provider.
#
# This object names WHICH Key Vault objects the pod may mount and WHICH
# Azure identity to authenticate as (via the ServiceAccount's workload
# identity annotation) — it carries no secret value of any kind. The CSI
# driver resolves the two object names below against Key Vault at pod
# start, using a token exchanged for the pod's federated identity, and
# mounts them as files under /mnt/secrets-store inside the container. No
# Kubernetes Secret object is created anywhere in this flow (no
# `secretObjects` block below) — deliberately, so there is nothing synced,
# nothing to leak from `kubectl describe secret`, and nothing to rotate by
# hand. See templates/deployment.yaml for how the container turns those two
# files into the SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# env vars Spring Boot already expects.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "helix.fullname" . }}-db-secrets
  labels:
    {{- include "helix.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Same client ID as the ServiceAccount annotation — the CSI provider
    # plugin needs it explicitly because it authenticates independently of
    # the SDK-level DefaultAzureCredential chain the JVM would otherwise use.
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.secretProviderClass.keyvaultName | quote }}
    tenantId: {{ .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.secretProviderClass.dbUsernameObjectName }}
          objectType: secret
        - |
          objectName: {{ .Values.secretProviderClass.dbPasswordObjectName }}
          objectType: secret
{{- end -}}
