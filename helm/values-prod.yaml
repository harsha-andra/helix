# Production overrides. Every placeholder in angle brackets below is
# deliberate — this file is committed, and a subscription id, tenant id or
# real hostname is not. Supply the real values with `--set` or a separate,
# uncommitted values file at deploy time (see infra/README.md).

replicaCount: 3

image:
  tag: "1.0.0"

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 1536Mi
    # 75% of 1536Mi ~= 1152Mi heap ceiling, ~384Mi left for metaspace/
    # threads/code cache/direct buffers under real production load —
    # generously more than the 512Mi floor noted in values.yaml.

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 2   # tolerates one voluntary disruption (node drain, rollout) at a time

ingress:
  enabled: true
  host: "<prod-hostname>"
  tls:
    secretName: helix-prod-tls

env:
  springProfilesActive: "prod"
  allowedOrigins: "https://<prod-hostname>"
  logLevel: "INFO"

database:
  host: "<prod-postgres-flexible-server-fqdn>"
  name: helix

oauth2:
  issuerUri: "https://login.microsoftonline.com/<prod-tenant-id>/v2.0"

serviceAccount:
  workloadIdentityClientId: "<prod-identity-client-id>"

secretProviderClass:
  keyvaultName: "<prod-keyvault-name>"
  tenantId: "<prod-tenant-id>"

networkPolicy:
  enabled: true
  postgres:
    cidr: "<prod-vnet-postgres-subnet-cidr>"

serviceMonitor:
  enabled: true
  bearerTokenSecretName: "<prometheus-scrape-token-secret>"
